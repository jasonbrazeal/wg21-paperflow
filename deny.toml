# cargo-deny configuration for the wg21-paperflow Rust workspace. CI runs
# `cargo deny check` for paper-mcp; run the same locally.

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities and yanked crates always fail. "unmaintained" is scoped to
# crates this workspace depends on directly.
unmaintained = "workspace"
# Reviewed advisories consciously accepted go here, each with a rationale.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with distributing a BSL-1.0 workspace.
allow = [
    "BSL-1.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
