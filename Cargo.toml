[workspace]
resolver = "3"
members = ["crates/*"]
# Path dependencies inside the workspace directory would otherwise be
# adopted as members and inherit *this* root's workspace tables; the nested
# promptforge checkout is its own workspace.
exclude = ["vendor/promptforge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "BSL-1.0"
repository = "https://github.com/cppalliance/wg21-paperflow"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
doc_markdown = "allow"
