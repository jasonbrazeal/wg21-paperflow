[package]
name = "paper-mcp"
description = "MCP server giving prompts full access to WG21 paper text, metadata, and citations"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "BSL-1.0"
repository = "https://github.com/cppalliance/wg21-paperflow"
publish = false

# paper-mcp is its own workspace, excluded from the paperflow root one, so
# it builds from this directory alone (its Docker image needs nothing else).
# The package values and lints mirror the root workspace's.
[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
doc_markdown = "allow"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
fastembed = { version = "7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
qdrant-client = { version = "1.19.0", default-features = false, features = ["serde", "uuid"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "1.1.8"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.27.0", features = ["v4", "v5"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11.0"
reqwest = { version = "0.13.4", default-features = false }
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"

[[test]]
name = "it"
path = "tests/it/main.rs"
