[package]
name = "paper-mcp"
description = "Index WG21 papers and serve search over MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Deterministic stand-in models for tests and CI, which have no model files.
test-models = []

[dependencies]
anyhow = "1.0.104"
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
clap = { version = "4.6.6", features = ["derive"] }
# Without default features fastembed has no Hugging Face Hub client, so it
# cannot download models; only ONNX Runtime's binaries are fetched, at build time.
fastembed = { version = "7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
futures = "0.3.34"
# Pinned exactly, with the Arrow crates it is built against: LanceDB is 0.x
# and breaks API between releases. 0.40.0 fails to compile without the
# `remote` feature (`job.rs` names an error variant gated behind it); the
# remote client is compiled in but never used, since the store only opens
# local paths.
lancedb = { version = "=0.40.0", features = ["remote"] }
# Pinned exactly: ort release candidates break API between releases, and
# fastembed requires this exact version.
ort = { version = "=2.0.0-rc.13", default-features = false }
paperstore = { version = "0.1.0", path = "../paperstore" }
paperstore-sqlite = { version = "0.1.0", path = "../paperstore-sqlite" }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Integration tests build against the library with the test-double models.
paper-mcp = { path = ".", features = ["test-models"] }
temp-env = "0.3.6"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
