[package]
name = "paper-mcp"
description = "Search and read the WG21 paper corpus over MCP"
version.workspace = true
edition.workspace = true
# lancedb 0.40.0 requires Rust 1.91, above the workspace minimum.
rust-version = "1.91"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
# rustls TLS for the ONNX Runtime binary and model downloads, matching the
# rest of the workspace instead of linking the system OpenSSL.
fastembed = { version = "=7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
futures = "0.3.34"
# lancedb 0.40.0 references its `remote`-gated `Error::Http` variant
# unconditionally in `job.rs` and does not compile without `remote`.
lancedb = { version = "=0.40.0", features = ["remote"] }
# Pinned exactly: ort has no stable 2.x, and this must match the exact
# version fastembed 7.1.1 requires.
ort = { version = "=2.0.0-rc.13", default-features = false }
paperstore = { version = "0.1.0", path = "../paperstore" }
paperstore-sqlite = { version = "0.1.0", path = "../paperstore-sqlite" }
rmcp = { version = "=3.5.1", features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi", "env-filter"] }

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
reqwest = { version = "0.13.4", default-features = false }
rmcp = { version = "=3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
temp-env = "0.3.6"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "time", "macros"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
