# Runs every package's test suite in parallel, plus the top-level integration tests.

name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Run ruff
        run: uv run ruff check packages tests

  typecheck:
    name: pyright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Run pyright
        run: uv run pyright packages
        continue-on-error: true

  package-tests:
    name: ${{ matrix.package }} tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [paperstore, mailing, tomd, whisker, cli, assay, pipeline, agora, preview, cpp-mcp]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Run ${{ matrix.package }} tests
        run: uv run pytest packages/${{ matrix.package }}/tests

  paperweight:
    name: paperweight (cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The paperweight crate depends on promptforge through the
      # vendor/promptforge submodule, so the checkout must be recursive.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build paperweight
        run: cargo build --release -p paperweight --locked

      - name: Test paperweight
        run: cargo test -p paperweight --locked

      - uses: actions/upload-artifact@v4
        with:
          name: paperweight-linux-x86_64
          path: target/release/paperweight
          if-no-files-found: error

  paper-mcp:
    name: paper-mcp (cargo, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Platforms with prebuilt ONNX Runtime binaries where LanceDB builds.
        os: [ubuntu-latest, macos-latest]
    steps:
      # The Cargo workspace includes paperweight, whose vendor/promptforge
      # submodule must be present for any workspace build.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: rustup toolchain install

      # LanceDB's build scripts compile protobuf definitions.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build paper-mcp
        run: cargo build -p paper-mcp --locked

      # Tests use the hash test embedder; nothing downloads the model.
      - name: Test paper-mcp and paperstore
        run: cargo test --locked -p paperstore -p paperstore-sqlite -p paper-mcp

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Test cpp-mcp coexistence
        run: uv run --no-dev --package cpp-mcp --with pytest pytest tests/test_paper_mcp_cpp_mcp_coexist.py
        env:
          PAPER_MCP_BIN: ${{ github.workspace }}/target/debug/paper-mcp

  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Run top-level tests
        run: uv run pytest tests
